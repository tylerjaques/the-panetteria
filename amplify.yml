# AWS Amplify Hosting build spec. When present, this file overrides the
# build settings in the Amplify console. Requires the Amazon Linux 2023
# build image (Node 18+ can't run on the older Amazon Linux 2 image).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
